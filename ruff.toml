# Lint config for pydyn (serial python reference of the TM5 dynamic core).
# Same rule set as tm5-zoom's tools/disk_usage so "it passes" means the same thing everywhere.
target-version = "py39"
line-length = 110

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "RUF", "NPY201", "ISC001", "PIE794", "PIE807"]

[lint.isort]
known-local-folder = ["common"]  # tests/common.py, imported by the tests as a sibling module

[format]
quote-style = "preserve"
