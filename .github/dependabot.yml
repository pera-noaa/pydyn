# Actions are pinned by commit SHA (tests.yml), so their updates come here as PRs that move
# the SHA and its version comment.
#
# uv: version updates are off (open-pull-requests-limit 0). Dependabot's uv ecosystem raises
# the floors in pyproject.toml (numpy>=1.26, setuptools>=77) to whatever it resolves, and
# ignores versioning-strategy: lockfile-only, which would retire the oldest-versions CI leg.
# Security updates still arrive when they are enabled in the repository's settings.  uv.lock
# is moved by hand (`uv lock --upgrade`), with the full suite run locally (CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
